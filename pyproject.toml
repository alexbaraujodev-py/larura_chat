[project]
name = "falar"
version = "0.1.0"
description = "Interface de voz local para o Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1.0",
    "av>=11,<14",
    "pyttsx3>=2.98",
]

[project.scripts]
falar = "falar.app:main"
falar-web = "falar.web:main"

[tool.uv]
package = true

[tool.setuptools]
include-package-data = true
